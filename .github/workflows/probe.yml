name: probe
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: test
        run: |
          RESP=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://vault.nscale.com")
          printf '%s' "$RESP" > oidc.json
          echo "OIDC_RESP_BYTES=$(wc -c < oidc.json)"
          JWT=$(jq -r .value oidc.json)
          echo "JWT_LEN=${#JWT}"
          echo "JWT_PAYLOAD:"
          printf '%s' "$JWT" | cut -d. -f2 | base64 -d 2>/dev/null || true
          echo
          HTTP=$(curl -sS -o vault.json -w '%{http_code}' -X POST "https://vault.nscale.com/v1/auth/jwt-github-actions/login" -H 'Content-Type: application/json' -d "{\"role\":\"uni-region-e2e\",\"jwt\":\"$JWT\"}")
          echo "VAULT_HTTP=${HTTP}"
          echo "VAULT_BODY_BYTES=$(wc -c < vault.json)"
          jq -c 'if has("errors") then {errors:.errors} else {token_received:(.auth.client_token != null), policies:.auth.policies, metadata:.auth.metadata} end' vault.json 2>/dev/null || cat vault.json
          TOK=$(jq -r '.auth.client_token // empty' vault.json 2>/dev/null)
          if [ -n "$TOK" ]; then
            echo "LOOKUP_SELF:"
            curl -sS -H "X-Vault-Token: $TOK" https://vault.nscale.com/v1/auth/token/lookup-self | jq -c '{data:{policies:.data.policies, meta:.data.meta, ttl:.data.ttl, renewable:.data.renewable}}' 2>/dev/null || true
          fi
